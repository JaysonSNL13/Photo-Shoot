<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Photo Shoot Tracker</title>
<style>
  :root{
    --bg:#f5f5f5; --card:#ffffff; --ink:#1d1d1f; --soft:#3a3a3a; --muted:#6e6e6e; --faint:#c7c7c7;
    --line:#e6e6e6; --hover:#f3f3f3;
    --green:#34c759; --green-ink:#1a7f37; --amber:#ff9f0a; --amber-ink:#b7791f;
    --teal:#3a3a3a; --red:#ff3b30; --gray:#8e8e8e;
    --green-bg:#e7f8ec; --amber-bg:#fff2e0; --gray-bg:#efefef;
    --track:#e8e8e8; --field:#ededed;
    /* shared column template — the frozen header row and every data row use this so they line up.
       PO column removed: rows are now sub-grouped by PO under a PO bar (see render()). */
    --cols:minmax(360px,2fr) 120px 84px 230px 120px 128px;
    /* legacy hold tints referenced by the Tal styles */
    --amber-line:#f0dcae; --holdbg:#fffaf0;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:min(1400px,95vw);margin:0 auto;padding:22px 20px 60px;}

  /* sticky top bar = header + search + frozen column-header row, all pinned together */
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);margin:-22px -20px 18px;padding:22px 20px 12px;box-shadow:0 8px 14px -10px rgba(0,0,0,.14);}
  /* header */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  h1{font-weight:600;font-size:22px;letter-spacing:-0.02em;margin:0;}
  .subtitle{font-size:13px;color:var(--muted);margin-top:3px;}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  #updated{font-size:12px;color:var(--muted);}
  .metabtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  #syncstat{font-size:12px;}
  #tallink,#refresh{font:inherit;font-size:14px;font-weight:500;border-radius:12px;padding:8px 15px;cursor:pointer;border:0;line-height:1;}
  #tallink{background:var(--gray-bg);color:var(--ink);}
  #tallink:hover{background:#e3e3e3;}
  #refresh{background:var(--ink);color:#fff;}
  #refresh:hover{background:#333;}
  #refresh:disabled{opacity:.5;cursor:default;}

  /* toolbar (search + export) + subtle summary line */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  .field{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:10px;padding:8px 12px;flex:1;min-width:220px;}
  .field svg{width:15px;height:15px;fill:var(--gray);flex:none;}
  .field input{border:0;background:transparent;outline:none;font:inherit;font-size:14px;width:100%;color:var(--ink);}
  .field input::placeholder{color:var(--gray);}
  .field input::-webkit-search-cancel-button{-webkit-appearance:none;}
  .field:focus-within{box-shadow:inset 0 0 0 1.5px var(--soft);}
  .xls{font:inherit;font-size:14px;font-weight:500;background:var(--gray-bg);color:var(--ink);border:0;border-radius:12px;padding:9px 15px;cursor:pointer;flex:none;}
  .xls:hover{background:#e3e3e3;}
  .summary{font-size:12.5px;color:var(--muted);white-space:nowrap;margin:8px 2px 0;}
  .summary b{color:var(--ink);font-weight:600;} .summary .rdy{color:var(--green-ink);}

  /* frozen table column-header row (lives in the sticky topbar) */
  .ptable-head{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:9px 16px;box-shadow:var(--shadow);margin-top:12px;}
  .hcell{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;display:flex;align-items:center;gap:5px;position:relative;}
  .hcell.sortable,.hcell.hmenu-trigger{cursor:pointer;user-select:none;}
  .hcell.sortable:hover,.hcell.hmenu-trigger:hover{color:var(--soft);}
  .hcell .car{font-size:9px;color:var(--gray);}
  .hcell .aff{font-size:9px;color:var(--ink);}
  .hcell .cur{font-size:10px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;}
  .hcell.active{color:var(--ink);}
  .hcell.active .car,.hcell.active .aff{color:var(--ink);}
  .hcell.disabled{opacity:.4;}

  /* header filter popover (iOS-style) */
  .hmenu{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px -6px rgba(0,0,0,.22),0 2px 8px rgba(0,0,0,.10);padding:5px;min-width:172px;}
  .hmenu-item{font-size:13.5px;color:var(--ink);padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .hmenu-item:hover{background:var(--hover);}
  .hmenu-item.sel{color:var(--ink);font-weight:600;}
  .hmenu-item.sel:after{content:'\2713';color:var(--ink);}

  /* re-shoot — styled to match the main tracker (white rounded card, hairlines, monochrome) */
  .reshoot{margin-bottom:18px;}
  .reshoot .ttl{font-size:13px;font-weight:600;color:var(--muted);padding:2px 4px;}
  .matchlist{border:1px solid var(--line);border-radius:12px;background:#fff;max-height:230px;overflow:auto;margin-top:10px;box-shadow:var(--shadow);}
  .matchlist div{padding:10px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line);}
  .matchlist div:last-child{border-bottom:0;}
  .matchlist div:hover{background:var(--hover);}
  .queue{margin-top:6px;}
  /* re-shoot collapsible (renderQueue builds .bucket/.rs-toggle/.rs-body/.po/table) */
  #rs-queue .bucket{margin-top:8px;}
  .rs-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink);padding:8px 4px;user-select:none;}
  .rs-toggle .car{font-size:13px;color:var(--muted);width:14px;display:inline-block;}
  .rs-toggle:hover{color:var(--soft);}
  .rs-collapsed .rs-body{display:none;}
  #rs-queue .po{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
  #rs-queue table{width:100%;border-collapse:collapse;}
  #rs-queue thead th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:11px 16px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafafa;}
  #rs-queue tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top;color:var(--ink);}
  #rs-queue tbody tr:last-child td{border-bottom:0;}
  #rs-queue tbody tr:hover{background:var(--hover);}
  #rs-queue .rs-name{font-size:14.5px;color:var(--ink);}
  #rs-queue .rs-subcat{font-size:12px;color:var(--muted);margin-top:1px;}
  #rs-queue .rs-note{font-size:11.5px;color:var(--teal);margin-top:3px;line-height:1.4;}
  #rs-queue .tal-chips{flex-wrap:wrap;}
  .c-cat{width:150px;color:var(--muted);} .c-pick{width:52px;text-align:center;} .c-shot{width:120px;}
  .rs-notebtn{display:block;margin-bottom:6px;font:inherit;font-size:11px;color:var(--teal);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0;}
  .rs-remove{font:inherit;font-size:12px;font-weight:500;border:0;background:var(--gray-bg);color:var(--red);border-radius:9px;padding:6px 11px;cursor:pointer;}
  .rs-remove:hover{background:#e3e3e3;}

  /* month sections + table (main view) */
  .month{margin-bottom:24px;}
  .month-title{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px 8px;margin-top:14px;}
  .ptable{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;}
  /* PO grouping bar (one per PO within a month) — mirrors the Tal PO bar look */
  .pobar{display:flex;align-items:center;gap:12px;padding:11px 18px;background:#fafafa;border-bottom:1px solid var(--line);}
  .pobar .num{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em;white-space:nowrap;}
  .pobar .cnt{font-size:12.5px;color:var(--muted);}
  .pobar .sp{flex:1;}
  .pobar .nb{font-size:12px;color:var(--muted);white-space:nowrap;}
  .row{border-top:1px solid var(--line);}
  .row:first-of-type{border-top:0;}
  .trow{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:11px 16px;cursor:pointer;}
  .c-cat{font-size:12.5px;color:var(--soft);}
  .trow:hover{background:var(--hover);}
  .row.rsub .trow{background:#fbfbfd;}                 /* suit piece rows: subtle tint */
  .row.rsub .trow:hover{background:var(--hover);}
  .row.rsub .c-item .nm{padding-left:14px;}            /* indent pieces under their suit */
  .c-item{min-width:0;}
  .c-item .nm{display:flex;align-items:center;gap:7px;}
  .chev{color:var(--faint);font-size:15px;line-height:1;transition:transform .18s ease;flex:none;}
  .row.open .chev{transform:rotate(90deg);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.d-ready{background:var(--green);} .dot.d-needs{background:var(--amber);} .dot.d-wait{background:var(--faint);}
  .rtitle{font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;}
  .rcat{font-size:12px;color:var(--muted);margin-top:1px;}
  .rnote{font-size:11.5px;margin-top:3px;line-height:1.4;}
  .rnote.amber{color:var(--amber-ink);} .rnote.teal{color:var(--teal);}
  .c-needby{font-size:13px;color:var(--soft);white-space:nowrap;}
  .c-upd{display:flex;flex-direction:column;gap:10px;}
  .size-field{display:flex;align-items:flex-start;gap:9px;font-size:12px;line-height:1.35;}
  .pt-lab{width:40px;flex:none;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:1px;}
  .pt-main{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .pt-size{font-size:12.5px;font-weight:600;color:var(--ink);overflow-wrap:anywhere;}
  .pt-size.none{color:var(--faint);font-weight:400;}
  .pt-status{color:var(--muted);font-size:11px;line-height:1.3;}
  .pt-status.landed{color:var(--green-ink);font-weight:600;}
  .pt-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:6px;}
  .pt-tag{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);background:var(--gray-bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;}
  .c-status{}
  .c-shot{}
  .pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:4px 11px;white-space:nowrap;}
  .p-ready{background:var(--green-bg);color:var(--green-ink);}
  .p-needs{background:var(--amber-bg);color:var(--amber-ink);}
  .p-wait{background:var(--gray-bg);color:var(--muted);}
  .rdetail{display:none;padding:2px 16px 15px 46px;background:#fafafc;border-top:1px solid var(--line);}
  .row.open .rdetail{display:block;}
  /* expand is split into two labelled sections: Samples + Notes */
  .dsec{margin-top:12px;}
  .dsec-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}
  .dsub{font-size:11.5px;color:var(--muted);}
  .dline{display:flex;gap:12px;font-size:13px;padding:4px 0;align-items:baseline;}
  .dlab{color:var(--muted);min-width:120px;flex:none;}
  .dval{color:var(--ink);}
  .dval.amber{color:var(--amber-ink);} .dval.teal{color:var(--teal);} .dval.green{color:var(--green-ink);}
  .linkbtn{margin-top:8px;font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .none{color:var(--faint);}

  /* iOS-ish shot select (shared by main view + re-shoot) */
  select.shot{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background-color:var(--gray-bg);border:0;border-radius:9px;padding:8px 26px 8px 11px;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;width:112px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238e8e93' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;}
  select.shot.is-shot{background-color:var(--ink);color:#fff;font-weight:600;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23ffffff' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");}

  .state{padding:46px 24px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px;box-shadow:var(--shadow);}
  footer{margin-top:22px;text-align:center;font-size:11px;color:var(--faint);}

  @media (max-width:900px){
    :root{--cols:minmax(200px,1.6fr) 100px 72px 190px 110px 116px;}
  }
  @media (max-width:680px){
    .ptable-head{display:none;}
    .trow{display:block;padding:12px 16px;}
    .trow>div{margin-bottom:7px;}
    .trow>div.c-shot{margin-bottom:0;}
    .rdetail{padding-left:16px;}
  }

  /* ===== Tal approval overlay (iOS sheet) ===== */
  #talOverlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;}
  .tal-wrap{max-width:min(1500px,96vw);margin:0 auto;padding:0 20px 60px;}
  .tal-sticky{position:sticky;top:0;background:var(--bg);z-index:10;padding:18px 0 12px;}
  .tal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}
  .tal-head h2{font-size:22px;font-weight:600;letter-spacing:-0.02em;margin:0;}
  .tal-legend{font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--card);border-radius:14px;padding:13px 15px;margin:0 0 14px;box-shadow:var(--shadow);}
  .tal-legend b{color:var(--ink);font-weight:600;}
  .talbtn{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:12px;background:var(--gray-bg);color:var(--ink);padding:8px 14px;cursor:pointer;}
  .talbtn:hover{background:#e3e3e3;}
  .tal-tabs{display:inline-flex;background:var(--track);border-radius:10px;padding:3px;gap:3px;margin:0 0 14px;}
  .tal-tab{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:8px 16px;cursor:pointer;border-radius:8px;}
  .tal-tab.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .tal-tab .cnt{font-size:12px;color:var(--muted);margin-left:5px;} .tal-tab.on .cnt{color:var(--ink);}
  .tal-toolbar{display:flex;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap;}
  .tal-toolbar input[type=search]{font:inherit;font-size:14px;border:0;background:var(--field);border-radius:10px;padding:9px 13px;min-width:240px;outline:none;}
  .tal-toolbar input[type=search]::placeholder{color:var(--gray);}
  .tal-toolbar input[type=search]:focus{box-shadow:inset 0 0 0 1.5px var(--soft);}
  .tal-counter{font-size:12.5px;color:var(--muted);}
  .tal-month{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px 8px;margin:24px 0 4px;}
  .tal-month:first-child{margin-top:6px;}
  .tal-po{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .tal-pobar{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .tal-ponum{font-size:13px;font-weight:600;} .tal-pometa{font-size:12.5px;color:var(--muted);} .tal-pometa b{color:var(--soft);}
  .tal-pocat{font-size:12px;color:var(--muted);}
  .tal-needby{font-size:11.5px;font-weight:600;color:var(--soft);background:#eef0f2;border-radius:999px;padding:3px 11px;margin-left:6px;}
  #talOverlay table{width:100%;border-collapse:collapse;}
  /* Ready & On-Hold tables: lock column widths so every PO group lines up */
  #tal-ready-view table,#tal-hold-view table{table-layout:fixed;}
  #tal-ready-view td,#tal-hold-view td{vertical-align:top;overflow-wrap:anywhere;}
  /* 4 cols now (Category removed): Item(auto) · PPS · TOPS · Status */
  #tal-ready-view th:nth-child(2),#tal-ready-view td:nth-child(2),#tal-hold-view th:nth-child(2),#tal-hold-view td:nth-child(2){width:170px;}
  #tal-ready-view th:nth-child(3),#tal-ready-view td:nth-child(3),#tal-hold-view th:nth-child(3),#tal-hold-view td:nth-child(3){width:200px;}
  #tal-ready-view th:nth-child(4),#tal-ready-view td:nth-child(4),#tal-hold-view th:nth-child(4),#tal-hold-view td:nth-child(4){width:240px;}
  #talOverlay th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);}
  #talOverlay td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px;}
  #talOverlay tbody tr:last-child td{border-bottom:0;}
  #talOverlay td.it{font-weight:500;width:26%;} #talOverlay td.cat{color:var(--muted);width:110px;} #talOverlay td.oh{font-size:13px;} #talOverlay td.oh .lab{color:var(--muted);}
  #talOverlay tr.heldrow td{background:var(--holdbg);}
  .tal-actbox{width:216px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff;}
  /* Shoot-with segmented control (PPS | TOPS) sits at the top of the action stack */
  .tal-swrow{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);background:#fafafa;}
  .tal-swrow .lb{font-size:11px;font-weight:600;color:var(--muted);}
  .tal-swseg{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .tal-swseg button{font:inherit;font-size:11.5px;font-weight:600;padding:4px 13px;border:0;background:#fff;color:var(--soft);cursor:pointer;line-height:1.4;}
  .tal-swseg button+button{border-left:1px solid var(--line);}
  .tal-swseg button.on{background:var(--ink);color:#fff;}
  .tal-actbox .tal-approve{border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;padding:12px;}
  .tal-actbox .tal-approve:hover{background:#333;}
  .tal-actbox .tal-hold{border:0;border-top:1px solid var(--line);background:#fff;color:var(--soft);font:inherit;font-weight:500;font-size:14px;cursor:pointer;padding:11px;}
  .tal-actbox .tal-hold:hover{background:var(--hover);}
  .tal-actbox .tal-bottom{display:flex;border-top:1px solid var(--line);}
  .tal-actbox .tal-bottom button{flex:1;border:0;background:#fff;color:var(--soft);font:inherit;font-size:12px;font-weight:500;cursor:pointer;padding:9px 4px;white-space:nowrap;}
  .tal-actbox .tal-bottom button:not(:last-child){border-right:1px solid var(--line);}
  .tal-actbox .tal-bottom button:hover{background:var(--hover);}
  .tal-actbox .tal-bottom button.on{background:var(--ink);color:#fff;}
  .tal-smpl{display:flex;flex-direction:column;gap:7px;}
  .tal-pg{display:flex;align-items:flex-start;gap:8px;}
  .tal-pglab{font-size:11px;color:var(--muted);width:84px;flex:none;padding-top:2px;}
  .tal-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;}
  /* display mode: sizes read as one tidy comma-separated line in dark ink (wraps only if truly long) */
  .tal-sizes{font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;overflow-wrap:anywhere;}
  .tal-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;padding:0;}
  .tal-nosz{color:var(--muted);font-size:11.5px;font-style:italic;}
  .tal-chip .x{display:none;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;}
  .tal-chip .x:hover{color:var(--red);}
  .tal-editing .tal-chip .x{display:inline;}
  .tal-editing .tal-chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 9px;}
  .tal-addchip{display:none;align-items:center;font-size:12.5px;border:1px dashed var(--gray);color:var(--muted);border-radius:999px;padding:3px 11px;cursor:pointer;background:#fff;}
  .tal-editing .tal-addchip{display:inline-flex;}
  .tal-addchip:hover{border-color:var(--ink);color:var(--ink);}

  .tal-select{font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);background-color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 26px 6px 10px;cursor:pointer;outline:none;-webkit-appearance:none;appearance:none;width:100%;max-width:118px;line-height:1.3;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238e8e93' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 9px center;}
  .tal-select:hover{border-color:var(--gray);}

<script>
(function(){
  var CONFIG={owner:'jaysonsnl13',repo:'New-Launch',branch:'main',file:'PhotoShootJSON.json',baseFile:'PhotoBaseJSON.json',catalogFile:'ProductCatalog.json',searchPoolFile:'ReshootPool.json',talUrl:'Tal_Product_Approval.html',
    saveEndpoint:'https://script.google.com/macros/s/AKfycby3BUWU62_-71CB301fFaf6vLZNf0csIcWbRxm6LwdNOOqn9y4vmHtqhlgyFEtm4sK3cg/exec',
    refreshMs:60*60*1000};
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var state={all:[],units:[],filtered:[],flags:{},reshoot:[],catalog:[],searchPool:[],filters:{ready:'all',shot:'active',q:''},sort:{key:null,dir:1}};
  var talPending={};  // local writes (approve/shot/edits) not yet confirmed by the server — protected from the sync clobber
  var reshootOpen=false;  // "Style for Reshoot" collapsible — collapsed by default; flips when the user toggles the header
  var $=function(s){return document.querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function key(i){return (i.poRef||'')+'|'+(i.parentName||'');}
  function F(i){return state.flags[key(i)]||{};}

  // ---- shot status (saved + synced) ----
  var LS='shootTrackerFlags.v1', LSR='shootTrackerReshoot.v1', LSP='shootTrackerPending.v1';
  // Note "added" dates — kept in a SEPARATE key so the "Refresh now" cache-clear (which wipes LS/LSR/LSP) doesn't lose them.
  var LSND='shootTrackerNoteDates.v1'; var noteDates={};
  function loadNoteDates(){try{noteDates=JSON.parse(localStorage.getItem(LSND)||'{}')||{};}catch(e){noteDates={};}}
  // First-add semantics: stamp today's date the first time a note gets a value; clearing the note removes the date; editing keeps the original.
  function stampNote(k,field,hasVal){var e=noteDates[k]||{};if(hasVal){if(!e[field])e[field]=new Date().toISOString().slice(0,10);}else{if(e[field])delete e[field];}
    if(Object.keys(e).length)noteDates[k]=e;else delete noteDates[k];try{localStorage.setItem(LSND,JSON.stringify(noteDates));}catch(e2){}}
  function noteDateOf(k,field){var e=noteDates[k];var iso=e&&e[field];return iso?fmtShort(iso):'';}
  function loadLocal(){try{state.flags=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){state.flags={};} try{state.reshoot=JSON.parse(localStorage.getItem(LSR)||'[]')||[];}catch(e){state.reshoot=[];} try{talPending=JSON.parse(localStorage.getItem(LSP)||'{}')||{};}catch(e){talPending={};}}
  function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state.flags));}catch(e){} try{localStorage.setItem(LSR,JSON.stringify(state.reshoot));}catch(e){} try{localStorage.setItem(LSP,JSON.stringify(talPending));}catch(e){}}
  function shotOf(i){var f=F(i);return f.shot||f.shotStatus||i.shotStatus||'Not Shot';}
  function postSave(body){if(!CONFIG.saveEndpoint)return;try{fetch(CONFIG.saveEndpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});}catch(e){}}
  function repostPending(){try{Object.keys(talPending).forEach(function(k){var pf=talPending[k];if(!pf||!Object.keys(pf).length)return;var idx=k.indexOf('|');if(idx<0)return;var b={poRef:k.slice(0,idx),parentName:k.slice(idx+1)};Object.keys(pf).forEach(function(f){if(f==='shot')b.shotStatus=pf[f];else b[f]=pf[f];});postSave(b);});}catch(e){}}  // retry any write the server hasn't confirmed yet
  function saveShot(i,val){var k=key(i);state.flags[k]=Object.assign({},state.flags[k],{shot:val,shotStatus:val});talPending[k]=Object.assign({},talPending[k],{shot:val});saveLocal();postSave({poRef:i.poRef,parentName:i.parentName,shotStatus:val});applyFilters();}
  // Visible sync state: shows the last successful sync time, or a red banner if the live read fails (usually a sign-in issue).
  function setSync(ok){var el=document.getElementById('syncstat');var bn=document.getElementById('syncbanner');var t=new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});if(el){el.textContent=ok?('✓ Last sync '+t):'⚠ Live status not loading';el.style.color=ok?'#1a7f37':'#b42318';}if(bn){if(ok){bn.style.display='none';}else{bn.style.display='block';bn.innerHTML='⚠ Couldn\'t load live approvals from the server, so approvals &amp; holds may be out of date. Make sure you\'re signed into your <b>@stateandliberty.com</b> Google account in this browser, then click <b>Refresh now</b>. Still stuck? Try an Incognito window.';}}}
  function liveLoadStatus(){if(!CONFIG.saveEndpoint)return;var cb='__ps_'+Date.now()+'_'+Math.floor(Math.random()*1e6);var done=false;var to=setTimeout(function(){if(done)return;done=true;setSync(false);try{delete window[cb];}catch(e){}},12000);window[cb]=function(map){if(done)return;done=true;clearTimeout(to);try{if(map&&typeof map==='object'){Object.keys(map).forEach(function(k){var v=map[k];if(typeof v==='string')v={shot:v};state.flags[k]=Object.assign({},state.flags[k],v);if(talPending[k]){var pf=talPending[k];Object.keys(pf).forEach(function(ff){if(String(v&&v[ff]!=null?v[ff]:'')===String(pf[ff]!=null?pf[ff]:''))delete pf[ff];});if(Object.keys(pf).length)state.flags[k]=Object.assign({},state.flags[k],pf);else delete talPending[k];}});saveLocal();repostPending();if(state.all.length)applyFilters();setSync(true);}}catch(e){}try{delete window[cb];}catch(e){}};var s=document.createElement('script');s.src=CONFIG.saveEndpoint+'?callback='+cb+'&t='+Date.now();s.onerror=function(){if(done)return;done=true;clearTimeout(to);setSync(false);try{delete window[cb];}catch(e){}};document.head.appendChild(s);}

  // ---- derived ----
  function ppsLanded(i){return !!i.ppsLanded;}
  function topsLanded(i){return !!i.topsLanded;}
  function topsShipped(i){if(topsLanded(i))return true;var d=(i.topsDisplay||'');if(/label created|not yet received|not yet shipped|ETD|to ship|awaiting/i.test(d))return false;if(/ship|transit|landing|out for delivery|deliver|picked up|en route/i.test(d))return true;return !!i.topsTracking;}
  function sampleOn(i){return i.isSuit?i.suitReady:(ppsLanded(i)||topsLanded(i));}
  // PPS retires once TOPS is confirmed (shipped/locked/landed): collapse PPS to "sizing approved" so no one
  // preps PPS gear. Respect an explicit Tal PPS shoot-with choice (talRecSize==='PPS') — then keep PPS visible.
  function ppsRetired(i){if(i.isSuit)return false;if((F(i).talRecSize||'')==='PPS')return false;return topsShipped(i);}
  function talApproved(i){return (state.flags[key(i)]||{}).talStatus==='Approved';}
  function shootWithOf(i){if(i.isSuit)return 'per piece';var man=((state.flags[key(i)]||{}).talRecSize||'');if(man==='PPS'||man==='TOPS')return man;if(topsShipped(i))return 'TOPS';if(i.substitute)return 'TOPS';if(ppsLanded(i))return 'PPS';return i.topsSize?'TOPS':'PPS';}
  function chosenLanded(i){if(i.isSuit)return !!i.suitReady;var sw=shootWithOf(i);if(sw==='TOPS')return topsLanded(i);if(sw==='PPS')return ppsLanded(i)&&!i.substitute;return false;}
  function isReady(i){return talApproved(i)&&chosenLanded(i);}
  function needByISO(i){var d=i.bulkEtaDate||'';if(d.length<10)return '';var dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-14);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
  function fmtShort(iso){if(!iso||iso.length<10)return iso||'';return MONTHS[+iso.slice(5,7)-1].slice(0,3)+' '+(+iso.slice(8,10));}
  // DISPLAY-ONLY size cleaner: some feed size values have narrative baked in
  // (e.g. "M (landed); remaining shipped 5/22, S, L" or "orig S,M,L,XL,2XL; revised M & L").
  // Return just the size list: cut at the first "(" or ";", trim trailing punctuation, drop a trivial
  // leading "orig"/"revised" label. The FULL original string is still surfaced in the row expand (buildDetail).
  // TODO(long-term): have the refresh parser emit a clean ppsSize/topsSize + a separate size-note field so
  // this client-side scrub is unnecessary.
  function cleanSize(s){s=String(s==null?'':s).trim();if(!s)return '';var cut=s.search(/[;(]/);if(cut>=0)s=s.slice(0,cut);s=s.replace(/[\s,;·\-]+$/,'').trim();s=s.replace(/^(orig(inal)?|revised)\b[:\s]*/i,'').trim();return s;}

  // ---- suit merge ----
  var DRESS=['blazers','blazer','dress pants','dress pant','suit pants','suit pant','short blazers','short blazer'];
  var CASUAL=['casual blazers','casual blazer','casual pants','casual pant'];
  var IGN=['mini','micro','short','unstructured'];
  function nc(c){return String(c||'').toLowerCase().trim();}
  function fam(c){c=nc(c);return DRESS.indexOf(c)!==-1?'dress':(CASUAL.indexOf(c)!==-1?'casual':null);}
  function role(c){c=nc(c);return c.indexOf('short blazer')!==-1?'short':(c.indexOf('blazer')!==-1?'blazer':(c.indexOf('pant')!==-1?'pant':null));}
  function pat(n){var p=String(n).split(' - ');if(p.length<2)return n;if(p[p.length-1].trim().toLowerCase()==='short')p.pop();return p.slice(1).join(' - ').trim();}
  function pk(p){return String(p).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w&&IGN.indexOf(w)===-1;}).sort().join(' ');}
  function consolidateSuits(items){
    var g={},used={};
    items.forEach(function(i){var f=fam(i.category),r=role(i.category);if(!f||!r)return;var pkk=pk(pat(i.parentName));if(!pkk)return;var k=f+'|'+pkk;if(!g[k])g[k]={fam:f,roles:{},all:[]};if(!g[k].roles[r])g[k].roles[r]=i;g[k].all.push(i);});
    var suits=[];
    Object.keys(g).forEach(function(k){var x=g[k],r=x.roles,n=(r.blazer?1:0)+(r.pant?1:0)+(r.short?1:0);if(n<2)return;x.all.forEach(function(p){used[key(p)]=true;});suits.push(buildSuit(x));});
    return suits.concat(items.filter(function(i){return !used[key(i)];}));
  }
  function buildSuit(g){
    var pieces=['blazer','pant','short'].map(function(rr){return g.roles[rr];}).filter(Boolean);
    var etas=pieces.map(function(p){return p.bulkEtaDate||'';}).filter(Boolean).sort();
    var disp=pieces.map(function(p){return pat(p.parentName);}).sort(function(a,b){return b.length-a.length;})[0]||'Suit';
    var po={};pieces.forEach(function(p){if(p.poRef)po[p.poRef]=1;});
    var ep=pieces.slice().sort(function(a,b){return (a.bulkEtaDate||'').localeCompare(b.bulkEtaDate||'');})[0];
    return {isSuit:true,pieces:pieces,parentName:(g.fam==='casual'?'Casual Suit — ':'Suit — ')+disp,category:(g.fam==='casual'?'Casual Suit':'Suits'),
      poRef:'SUIT|'+g.fam+'|'+disp,poRefs:Object.keys(po),bulkEtaDate:etas[0]||'',bulkEta:(ep&&ep.bulkEta)||'',bulkExf:(ep&&ep.bulkExf)||'',
      suitReady:pieces.every(function(p){return ppsLanded(p)||topsLanded(p);}),shotStatus:'Not Shot'};
  }

  // ---- load ----
  function fileUrl(f){return 'https://raw.githubusercontent.com/'+CONFIG.owner+'/'+CONFIG.repo+'/'+CONFIG.branch+'/'+f+'?t='+Date.now();}
  function fetchJson(f){return fetch(fileUrl(f),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
  function load(){$('#loading').style.display='block';$('#error').style.display='none';$('#refresh').disabled=true;
    fetchJson(CONFIG.file).then(function(d){ingest(d);}).catch(function(){return fetchJson(CONFIG.baseFile).then(function(d){ingest(d);});})
    .catch(function(){$('#loading').style.display='none';$('#error').style.display='block';$('#error').textContent='Could not load the feed.';})
    .then(function(){$('#refresh').disabled=false;});}
  function ingest(d){state.all=Array.isArray(d.items)?d.items:[];$('#updated').textContent=d.lastUpdated?('Source updated '+fmtUpdated(d.lastUpdated)):'';applyFilters();renderQueue();$('#loading').style.display='none';}
  function fmtUpdated(iso){try{return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return iso;}}

    list.forEach(function(r){var mk=talMonthKey(r);if(!months[mk]){months[mk]={label:talMonthLabel(r),rows:[]};morder.push(mk);}months[mk].rows.push(r);});
    morder.sort();
    morder.forEach(function(mk){var mb=months[mk];
      var mh=document.createElement('div');mh.className='tal-month';mh.textContent='Photos needed — '+mb.label;root.appendChild(mh);
      var groups={},order=[];
      mb.rows.forEach(function(r){if(!groups[r.poGroup]){groups[r.poGroup]=[];order.push(r.poGroup);}groups[r.poGroup].push(r);});
      order.forEach(function(po){var grp=groups[po];var box=document.createElement('div');box.className='tal-po';
        var bar=document.createElement('div');bar.className='tal-pobar';
        bar.innerHTML=talPoBarHtml(po,talGrpCat(grp),grp[0].needBy);
        var pall=document.createElement('button');pall.className='talbtn';pall.style.fontSize='10.5px';pall.style.padding='4px 9px';pall.textContent='Approve all in PO';pall.addEventListener('click',function(){grp.forEach(function(r){talApprove(r);});});
        bar.appendChild(pall);box.appendChild(bar);
        var t=document.createElement('table');t.className='tal-approve-table';t.innerHTML='<thead><tr><th>Item</th><th style="width:190px">PPS</th><th style="width:190px">TOPS</th><th style="width:112px">Shoot with</th><th style="width:230px">Product note</th><th style="width:126px">Action</th></tr></thead><tbody></tbody>';
        var tb=t.querySelector('tbody');grp.forEach(function(r){tb.appendChild(talRowEl8(r));});box.appendChild(t);root.appendChild(box);});
    });
    talCounter();}
  // Tab 2 — Ready to Shoot: the previously-APPROVED rows. Same need-by MONTH grouping (earliest first).
  // Each row renders via talRowEl, which shows the "✓ Ready to shoot · via PPS/TOPS" badge + Undo for approved items.
  function talReadyRender(){var rows=talRows().filter(inList);var root=$('#tal-ready-view');root.innerHTML='';
    var list=rows.filter(function(r){return talFlag(r).talStatus==='Approved';});
    var tq=(talQuery||'').trim().toLowerCase();if(tq)list=list.filter(function(r){return ((r.name||'')+' '+(r.category||'')+' '+(r.poGroup||'')+' '+(r.poRef||'')).toLowerCase().indexOf(tq)!==-1;});
    if(!list.length){$('#tal-ready-empty').style.display='block';$('#tal-ready-empty').textContent=tq?'No approved matches for "'+tq+'".':'Nothing has been approved yet.';talCounter();return;}$('#tal-ready-empty').style.display='none';
    list.sort(function(a,b){return (a.needBy||'9999-99-99').localeCompare(b.needBy||'9999-99-99')||(a.poGroup||'').localeCompare(b.poGroup||'');});
    var months={},morder=[];
    list.forEach(function(r){var mk=talMonthKey(r);if(!months[mk]){months[mk]={label:talMonthLabel(r),rows:[]};morder.push(mk);}months[mk].rows.push(r);});
    morder.sort();
    morder.forEach(function(mk){var mb=months[mk];
      var mh=document.createElement('div');mh.className='tal-month';mh.textContent='Photos needed — '+mb.label;root.appendChild(mh);
      var groups={},order=[];
      mb.rows.forEach(function(r){if(!groups[r.poGroup]){groups[r.poGroup]=[];order.push(r.poGroup);}groups[r.poGroup].push(r);});
      order.forEach(function(po){var grp=groups[po];var box=document.createElement('div');box.className='tal-po';
        var bar=document.createElement('div');bar.className='tal-pobar';
        bar.innerHTML=talPoBarHtml(po,talGrpCat(grp),grp[0].needBy);
        box.appendChild(bar);
        var t=document.createElement('table');t.innerHTML='<thead><tr><th>Item</th><th>PPS</th><th>TOPS</th><th style="width:240px">Status</th></tr></thead><tbody></tbody>';
        var tb=t.querySelector('tbody');grp.forEach(function(r){tb.appendChild(talRowEl(r));});box.appendChild(t);root.appendChild(box);});
    });
    talCounter();}
  // Tab 2 — On Hold: the HELD rows. Same need-by MONTH grouping (earliest first).
  // Each renders via talRowEl, which for a held row shows the inline held action box
  // (Approve → clears hold + moves to Ready, Return to approvals) plus the reason and "On hold since" line.
  function talHeldRender(){var rows=talRows().filter(inList);var root=$('#tal-hold-view');root.innerHTML='';
    var list=rows.filter(function(r){return talIsHeld(r)&&!talAutoReturned(r);});
    var tq=(talQuery||'').trim().toLowerCase();if(tq)list=list.filter(function(r){return ((r.name||'')+' '+(r.category||'')+' '+(r.poGroup||'')+' '+(r.poRef||'')).toLowerCase().indexOf(tq)!==-1;});
    if(!list.length){$('#tal-hold-empty').style.display='block';$('#tal-hold-empty').textContent=tq?'No on-hold matches for "'+tq+'".':'Nothing is on hold right now.';talCounter();return;}$('#tal-hold-empty').style.display='none';
    list.sort(function(a,b){return (a.needBy||'9999-99-99').localeCompare(b.needBy||'9999-99-99')||(a.poGroup||'').localeCompare(b.poGroup||'');});
    var months={},morder=[];
    list.forEach(function(r){var mk=talMonthKey(r);if(!months[mk]){months[mk]={label:talMonthLabel(r),rows:[]};morder.push(mk);}months[mk].rows.push(r);});
    morder.sort();
    morder.forEach(function(mk){var mb=months[mk];
      var mh=document.createElement('div');mh.className='tal-month';mh.textContent='Photos needed — '+mb.label;root.appendChild(mh);
      var groups={},order=[];
      mb.rows.forEach(function(r){if(!groups[r.poGroup]){groups[r.poGroup]=[];order.push(r.poGroup);}groups[r.poGroup].push(r);});
      order.forEach(function(po){var grp=groups[po];var box=document.createElement('div');box.className='tal-po';
        var bar=document.createElement('div');bar.className='tal-pobar';
        bar.innerHTML=talPoBarHtml(po,talGrpCat(grp),grp[0].needBy);
        box.appendChild(bar);
        var t=document.createElement('table');t.innerHTML='<thead><tr><th>Item</th><th>PPS</th><th>TOPS</th><th style="width:240px">Action</th></tr></thead><tbody></tbody>';
        var tb=t.querySelector('tbody');grp.forEach(function(r){tb.appendChild(talRowEl(r));});box.appendChild(t);root.appendChild(box);});
    });
    talCounter();}
  // Switch between the three tabs. 'need' = To Approve (toolbar + #tal-view), 'hold' = On Hold (#tal-hold-view), 'ready' = Ready to Shoot (#tal-ready-view).
  function talShowTab(which){talTab=which;
    var tn=document.getElementById('tal-tab-need'),th=document.getElementById('tal-tab-hold'),tr2=document.getElementById('tal-tab-ready');
    if(tn)tn.classList.toggle('on',which==='need');if(th)th.classList.toggle('on',which==='hold');if(tr2)tr2.classList.toggle('on',which==='ready');
    document.getElementById('tal-toolbar-need').querySelector('#tal-all').style.display=which==='need'?'':'none';
    $('#tal-view').style.display=which==='need'?'block':'none';
    $('#tal-hold-view').style.display=which==='hold'?'block':'none';
    $('#tal-ready-view').style.display=which==='ready'?'block':'none';
    $('#tal-empty').style.display='none';$('#tal-hold-empty').style.display='none';$('#tal-ready-empty').style.display='none';
    if(which==='need')talRender();else if(which==='hold')talHeldRender();else talReadyRender();}
  function talOpen(){talShowTab('need');$('#talOverlay').style.display='block';document.body.style.overflow='hidden';}
  function talClose(){$('#talOverlay').style.display='none';document.body.style.overflow='';}

  // ---- header filter/sort (drives the same state.filters + a small sort state) ----
  function statusLabel(v){return {all:'All',ready:'Ready',needs:'Needs approval',notarrived:'Not yet arrived'}[v]||'All';}
  function shotLabel(v){return {all:'All',active:'Not shot',shot:'Shot'}[v]||'All';}
  // Status sub-filter is only meaningful in the Not-shot view (see matches()); dim the Status header otherwise.
  function syncSubFilterVis(){var sh=document.querySelector('.ptable-head .hcell[data-menu="status"]');if(sh)sh.classList.toggle('disabled',state.filters.shot!=='active');}
  function updateHeaderUI(){
    document.querySelectorAll('.ptable-head .hcell[data-sort]').forEach(function(h){var k=h.getAttribute('data-sort'),aff=h.querySelector('.aff');var on=state.sort.key===k;h.classList.toggle('active',on);if(aff)aff.textContent=on?(state.sort.dir>0?' ▲':' ▼'):'';});
    var sh=document.querySelector('.ptable-head .hcell[data-menu="status"]');if(sh){var c=sh.querySelector('.cur');if(c)c.textContent=state.filters.ready==='all'?'':statusLabel(state.filters.ready);sh.classList.toggle('active',state.filters.ready!=='all');}
    var so=document.querySelector('.ptable-head .hcell[data-menu="shot"]');if(so){var c2=so.querySelector('.cur');if(c2)c2.textContent=state.filters.shot==='active'?'':shotLabel(state.filters.shot);so.classList.toggle('active',state.filters.shot!=='active');}
    syncSubFilterVis();
  }
  function closeMenus(){var m=document.querySelector('.hmenu');if(m&&m.parentNode)m.parentNode.removeChild(m);document.removeEventListener('mousedown',docCloseMenu,true);}
  function docCloseMenu(e){if(!e.target.closest||(!e.target.closest('.hmenu')&&!e.target.closest('.hmenu-trigger')))closeMenus();}
  function openMenu(type,anchor){
    closeMenus();
    var opts=type==='status'?[['all','All'],['ready','Ready'],['needs','Needs approval'],['notarrived','Not yet arrived']]:[['all','All'],['active','Not shot'],['shot','Shot']];
    var cur=type==='status'?state.filters.ready:state.filters.shot;
    var m=document.createElement('div');m.className='hmenu';
    opts.forEach(function(o){var it=document.createElement('div');it.className='hmenu-item'+(o[0]===cur?' sel':'');it.textContent=o[1];it.addEventListener('click',function(e){e.stopPropagation();selectFilter(type,o[0]);closeMenus();});m.appendChild(it);});
    document.body.appendChild(m);
    var r=anchor.getBoundingClientRect();var w=m.offsetWidth;var left=Math.min(r.left,window.innerWidth-w-8);m.style.top=(r.bottom+6)+'px';m.style.left=Math.max(8,left)+'px';
    setTimeout(function(){document.addEventListener('mousedown',docCloseMenu,true);},0);
  }
  function selectFilter(type,v){if(type==='status')state.filters.ready=v;else state.filters.shot=v;syncSubFilterVis();applyFilters();renderQueue();}
  function clickSort(k){if(state.sort.key===k)state.sort.dir=-state.sort.dir;else{state.sort.key=k;state.sort.dir=1;}applyFilters();}

  // ---- events ----
  document.querySelectorAll('.ptable-head .hcell[data-sort]').forEach(function(h){h.addEventListener('click',function(){clickSort(h.getAttribute('data-sort'));});});
  document.querySelector('.ptable-head .hcell[data-menu="status"]').addEventListener('click',function(e){e.stopPropagation();openMenu('status',this);});
  document.querySelector('.ptable-head .hcell[data-menu="shot"]').addEventListener('click',function(e){e.stopPropagation();openMenu('shot',this);});
  syncSubFilterVis();
  $('#search').addEventListener('input',function(e){state.filters.q=e.target.value;applyFilters();renderQueue();suggest();});
  // Refresh now = push any unsaved local writes, clear this device's local cache, then HARD-reload (cache-busted) fresh from the server.
  $('#refresh').addEventListener('click',function(){try{repostPending();}catch(e){}try{localStorage.removeItem(LS);localStorage.removeItem(LSR);localStorage.removeItem(LSP);}catch(e){}setTimeout(function(){try{location.replace(location.origin+location.pathname+'?_hr='+Date.now());}catch(e){location.reload();}},500);});
  $('#tallink').addEventListener('click',talOpen);
  $('#tal-close').addEventListener('click',talClose);
  $('#tal-all').addEventListener('click',function(){talRows().forEach(function(r){talApprove(r);});});
  $('#tal-search').addEventListener('input',function(e){talQuery=e.target.value;if(talTab==='ready')talReadyRender();else if(talTab==='hold')talHeldRender();else talRender();});
  $('#tal-tab-need').addEventListener('click',function(){talShowTab('need');});
  $('#tal-tab-hold').addEventListener('click',function(){talShowTab('hold');});
  $('#tal-tab-ready').addEventListener('click',function(){talShowTab('ready');});
  $('#export').addEventListener('click',exportExcel);

  $('#src').textContent=CONFIG.owner+'/'+CONFIG.repo+'/'+CONFIG.file+'  ·  reads the same feed';
  loadLocal();loadNoteDates();load();loadSearchPool();loadCatalog();liveLoadStatus();loadReshoot();setInterval(liveLoadStatus,3*60*1000);setInterval(loadReshoot,3*60*1000);
})();
</script>
