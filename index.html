<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Photo Shoot Tracker</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&f[]=jetbrains-mono@400,500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#fff;--ink:#000;--soft:#3a3a3a;--muted:#7a7a7a;--faint:#c4c4c4;--line:#e5e5e5;--hover:#fafafa;--green:#1e7a46;--amber:#b7791f;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:'Satoshi',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 28px 48px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px;}
  h1{font-weight:700;font-size:clamp(22px,2.4vw,28px);margin:0;letter-spacing:-0.01em;}
  .subtitle{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
  .meta button{margin-top:4px;font-family:'Satoshi',sans-serif;font-weight:700;background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:5px 12px;cursor:pointer;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .meta button:hover{background:var(--bg);color:var(--ink);}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);width:300px;max-width:100%;margin-bottom:12px;}
  .stat{padding:8px 12px;text-align:center;border-right:1px solid var(--line);}
  .stat:last-child{border-right:0;}
  .stat-label{font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);}
  .stat-value{font-size:18px;font-weight:700;}
  .stat-value.green{color:var(--green);}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;}
  .seg{display:inline-flex;border:1px solid var(--ink);}
  .seg button{border:0;background:transparent;color:var(--ink);padding:6px 13px;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;border-right:1px solid var(--ink);font-family:'Satoshi',sans-serif;}
  .seg button:last-child{border-right:0;}
  .seg button.active{background:var(--ink);color:var(--bg);}
  .controls label{font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}
  .controls input[type=search]{font-family:'Satoshi',sans-serif;font-size:13px;border:1px solid var(--line);background:var(--bg);padding:7px 10px;min-width:240px;flex:1;outline:none;}
  #rs-add{font-family:'Satoshi',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:7px 12px;cursor:pointer;white-space:nowrap;}
  #rs-add:hover{background:var(--bg);color:var(--ink);}
  .check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);border:1px solid var(--line);padding:6px 10px;}
  .check input{accent-color:var(--ink);margin:0;}
  .spacer{flex:1;}
  .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);}
  .xls{font-family:'Satoshi',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:6px 12px;cursor:pointer;}
  .xls:hover{background:var(--bg);color:var(--ink);}
  /* re-shoot */
  .reshoot{border:1px solid var(--line);padding:10px 14px;margin:12px 0;background:var(--hover);}
  .reshoot .ttl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;}
  .matchlist{border:1px solid var(--line);background:#fff;max-height:200px;overflow:auto;margin-top:6px;}
  .matchlist div{padding:6px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--line);}
  .matchlist div:hover{background:var(--hover);}
  .queue{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;}
  .qchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:3px 8px;font-size:12px;}
  .qchip b{font-weight:500;} .qchip .x{cursor:pointer;color:var(--muted);font-weight:700;}
  .rs-size{font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid var(--line);padding:4px 6px;width:130px;outline:none;}
  .rs-remove{font-family:'Satoshi',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);background:var(--bg);color:var(--soft);padding:4px 9px;cursor:pointer;}
  .rs-remove:hover{border-color:var(--ink);color:var(--ink);}
  .c-pick{width:54px;text-align:center;}
  .bucket{margin-bottom:28px;}
  .bucket h2{font-weight:700;font-size:17px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:22px 0 12px;}
  .po{margin:0 0 14px;border:1px solid var(--line);}
  .pobar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--hover);border-bottom:1px solid var(--line);padding:8px 14px;}
  .ponum{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.04em;}
  .pometa{font-size:11.5px;color:var(--muted);} .pometa b{color:var(--soft);font-weight:700;}
  table{width:100%;border-collapse:separate;border-spacing:0;}
  thead th{background:var(--bg);text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover{background:var(--hover);}
  .c-cat{width:130px;color:var(--soft);} .c-size{width:130px;font-family:'JetBrains Mono',monospace;font-size:12px;} .c-when{width:150px;} .c-shot{width:110px;}
  .c-appr{width:150px;} .appr-ok{color:var(--green);font-weight:700;} .appr-hold{color:var(--amber);font-weight:700;font-size:12px;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:middle;}
  .dot.r{background:var(--green);} .dot.w{background:var(--faint);}
  .landed{color:var(--green);font-weight:700;} .eta{color:var(--soft);} .none{color:var(--faint);}
  select.shot{font-family:'Satoshi',sans-serif;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--bg);padding:5px 8px;cursor:pointer;outline:none;width:100px;}
  select.shot.is-shot{border-color:var(--green);color:var(--green);font-weight:700;}
  .state{padding:44px 24px;text-align:center;color:var(--muted);border:1px solid var(--line);}
  footer{margin-top:16px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.08em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Photo Shoot Tracker</h1>
      <div class="subtitle">New launches that need photos, by when. <span style="color:#185fa5;font-weight:700;">Simple v1</span></div>
    </div>
    <div class="meta"><div id="updated">&mdash;</div><button id="refresh" type="button">Refresh now</button></div>
  </header>

  <section class="stats">
    <div class="stat"><div class="stat-label">To Shoot</div><div class="stat-value" id="s-toshoot">&mdash;</div></div>
    <div class="stat"><div class="stat-label">Ready</div><div class="stat-value green" id="s-ready">&mdash;</div></div>
  </section>

  <section class="controls">
    <label>Show</label>
    <div class="seg" id="seg-status"><button data-v="all" class="active">All</button><button data-v="ready">Ready</button></div>
    <label>View</label>
    <div class="seg" id="seg-shot"><button data-v="active" class="active">Not Shot</button><button data-v="shot">Shot</button><button data-v="all">All</button></div>
    <input id="search" type="search" placeholder="Search to filter &mdash; or type a product, then pick it to re-shoot&hellip;" />
    <label class="check"><input type="checkbox" id="t-pps" /> PPS in hand</label>
    <label class="check"><input type="checkbox" id="t-tops" /> TOPS in hand</label>
    <div class="spacer"></div>
    <div class="count" id="count">&mdash;</div>
    <button class="xls" id="export" type="button">Download Excel</button>
  </section>

  <section class="reshoot">
    <div class="ttl">Re-shoot queue — type a product in the search box above and pick it from the suggestions. Any catalog product is findable; added items are included in the Excel export.</div>
    <div class="matchlist" id="rs-matches" style="display:none"></div>
    <div class="queue" id="rs-queue"></div>
  </section>

  <section id="view"></section>
  <div id="loading" class="state">Fetching latest data&hellip;</div>
  <div id="error" class="state" style="display:none"></div>
  <footer><span id="src"></span></footer>
</div>

<script>
(function(){
  var CONFIG={owner:'jaysonsnl13',repo:'New-Launch',branch:'main',file:'PhotoShootJSON.json',baseFile:'PhotoBaseJSON.json',catalogFile:'ProductCatalog.json',
    saveEndpoint:'https://script.google.com/macros/s/AKfycby3BUWU62_-71CB301fFaf6vLZNf0csIcWbRxm6LwdNOOqn9y4vmHtqhlgyFEtm4sK3cg/exec',
    refreshMs:60*60*1000};
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var state={all:[],units:[],filtered:[],flags:{},reshoot:[],catalog:[],filters:{status:'all',shot:'active',q:'',pps:false,tops:false}};
  var $=function(s){return document.querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function key(i){return (i.poRef||'')+'|'+(i.parentName||'');}
  function F(i){return state.flags[key(i)]||{};}

  // ---- shot status (saved + synced) ----
  var LS='shootTrackerFlags.v1', LSR='shootTrackerReshoot.v1';
  function loadLocal(){try{state.flags=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){state.flags={};} try{state.reshoot=JSON.parse(localStorage.getItem(LSR)||'[]')||[];}catch(e){state.reshoot=[];}}
  function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state.flags));}catch(e){} try{localStorage.setItem(LSR,JSON.stringify(state.reshoot));}catch(e){}}
  function shotOf(i){var f=F(i);return f.shot||f.shotStatus||i.shotStatus||'Not Shot';}
  function postSave(body){if(!CONFIG.saveEndpoint)return;try{fetch(CONFIG.saveEndpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});}catch(e){}}
  function saveShot(i,val){var k=key(i);state.flags[k]=Object.assign({},state.flags[k],{shot:val,shotStatus:val});saveLocal();postSave({poRef:i.poRef,parentName:i.parentName,shotStatus:val});applyFilters();}
  function liveLoadStatus(){if(!CONFIG.saveEndpoint)return;var cb='__ps_'+Date.now()+'_'+Math.floor(Math.random()*1e6);window[cb]=function(map){try{if(map&&typeof map==='object'){Object.keys(map).forEach(function(k){var v=map[k];if(typeof v==='string')v={shot:v};state.flags[k]=Object.assign({},state.flags[k],v);});saveLocal();if(state.all.length)applyFilters();}}catch(e){}try{delete window[cb];}catch(e){}};var s=document.createElement('script');s.src=CONFIG.saveEndpoint+'?callback='+cb+'&t='+Date.now();s.onerror=function(){try{delete window[cb];}catch(e){}};document.head.appendChild(s);}

  // ---- derived ----
  function ppsLanded(i){return !!i.ppsLanded;}
  function topsLanded(i){return !!i.topsLanded;}
  function isReady(i){return i.isSuit?i.suitReady:(ppsLanded(i)||topsLanded(i));}
  function shootWithOf(i){return i.isSuit?'per piece':(topsLanded(i)?'TOPS':(ppsLanded(i)?'PPS':(i.topsSize?'TOPS':'PPS')));}
  function needByISO(i){var d=i.bulkEtaDate||'';if(d.length<10)return '';var dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-14);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
  function fmtShort(iso){if(!iso||iso.length<10)return iso||'';return MONTHS[+iso.slice(5,7)-1].slice(0,3)+' '+(+iso.slice(8,10));}

  // ---- suit merge ----
  var DRESS=['blazers','blazer','dress pants','dress pant','suit pants','suit pant','short blazers','short blazer'];
  var CASUAL=['casual blazers','casual blazer','casual pants','casual pant'];
  var IGN=['mini','micro','short','unstructured'];
  function nc(c){return String(c||'').toLowerCase().trim();}
  function fam(c){c=nc(c);return DRESS.indexOf(c)!==-1?'dress':(CASUAL.indexOf(c)!==-1?'casual':null);}
  function role(c){c=nc(c);return c.indexOf('short blazer')!==-1?'short':(c.indexOf('blazer')!==-1?'blazer':(c.indexOf('pant')!==-1?'pant':null));}
  function pat(n){var p=String(n).split(' - ');if(p.length<2)return n;if(p[p.length-1].trim().toLowerCase()==='short')p.pop();return p.slice(1).join(' - ').trim();}
  function pk(p){return String(p).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w&&IGN.indexOf(w)===-1;}).sort().join(' ');}
  function consolidateSuits(items){
    var g={},used={};
    items.forEach(function(i){var f=fam(i.category),r=role(i.category);if(!f||!r)return;var pkk=pk(pat(i.parentName));if(!pkk)return;var k=f+'|'+pkk;if(!g[k])g[k]={fam:f,roles:{},all:[]};if(!g[k].roles[r])g[k].roles[r]=i;g[k].all.push(i);});
    var suits=[];
    Object.keys(g).forEach(function(k){var x=g[k],r=x.roles,n=(r.blazer?1:0)+(r.pant?1:0)+(r.short?1:0);if(n<2)return;x.all.forEach(function(p){used[key(p)]=true;});suits.push(buildSuit(x));});
    return suits.concat(items.filter(function(i){return !used[key(i)];}));
  }
  function buildSuit(g){
    var pieces=['blazer','pant','short'].map(function(rr){return g.roles[rr];}).filter(Boolean);
    var etas=pieces.map(function(p){return p.bulkEtaDate||'';}).filter(Boolean).sort();
    var disp=pieces.map(function(p){return pat(p.parentName);}).sort(function(a,b){return b.length-a.length;})[0]||'Suit';
    var po={};pieces.forEach(function(p){if(p.poRef)po[p.poRef]=1;});
    var ep=pieces.slice().sort(function(a,b){return (a.bulkEtaDate||'').localeCompare(b.bulkEtaDate||'');})[0];
    return {isSuit:true,pieces:pieces,parentName:(g.fam==='casual'?'Casual Suit — ':'Suit — ')+disp,category:(g.fam==='casual'?'Casual Suit':'Suits'),
      poRef:'SUIT|'+g.fam+'|'+disp,poRefs:Object.keys(po),bulkEtaDate:etas[0]||'',bulkEta:(ep&&ep.bulkEta)||'',bulkExf:(ep&&ep.bulkExf)||'',
      suitReady:pieces.every(function(p){return ppsLanded(p)||topsLanded(p);}),shotStatus:'Not Shot'};
  }

  // ---- load ----
  function fileUrl(f){return 'https://raw.githubusercontent.com/'+CONFIG.owner+'/'+CONFIG.repo+'/'+CONFIG.branch+'/'+f+'?t='+Date.now();}
  function fetchJson(f){return fetch(fileUrl(f),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
  function load(){$('#loading').style.display='block';$('#error').style.display='none';$('#refresh').disabled=true;
    fetchJson(CONFIG.file).then(function(d){ingest(d);}).catch(function(){return fetchJson(CONFIG.baseFile).then(function(d){ingest(d);});})
    .catch(function(){$('#loading').style.display='none';$('#error').style.display='block';$('#error').textContent='Could not load the feed.';})
    .then(function(){$('#refresh').disabled=false;});}
  function ingest(d){state.all=Array.isArray(d.items)?d.items:[];$('#updated').textContent=d.lastUpdated?('Source updated '+fmtUpdated(d.lastUpdated)):'';applyFilters();renderQueue();$('#loading').style.display='none';}
  function fmtUpdated(iso){try{return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return iso;}}
  // Full product catalog for the re-shoot search (so already-launched products like "Springer" are findable).
  // Accepts ["Name", ...] or [{parentName, category, poRef}, ...]. Falls back to the feed if unavailable.
  function loadCatalog(){fetchJson(CONFIG.catalogFile).then(function(d){var arr=Array.isArray(d)?d:(d.items||d.products||[]);state.catalog=arr.map(function(x){return typeof x==='string'?{name:x,category:'',po:'',sizes:''}:{name:x.parentName||x.name||'',category:x.category||'',po:x.poRef||x.po||'',sizes:x.sizes||''};}).filter(function(x){return x.name;});}).catch(function(){state.catalog=[];});}

  // ---- filter + render ----
  function matches(i,f,q){
    var shot=shotOf(i)==='Shot';
    if(f.shot==='active'&&shot)return false;
    if(f.shot==='shot'&&!shot)return false;
    if(f.status==='ready'&&!isReady(i))return false;
    if(f.pps&&!(i.isSuit?i.pieces.some(ppsLanded):ppsLanded(i)))return false;
    if(f.tops&&!(i.isSuit?i.pieces.some(topsLanded):topsLanded(i)))return false;
    if(q){var hay=(i.isSuit?(i.parentName+' '+i.poRefs.join(' ')+' '+i.pieces.map(function(p){return p.parentName+' '+(p.ppsSize||'')+' '+(p.topsSize||'');}).join(' ')):((i.parentName||'')+' '+(i.category||'')+' '+(i.poRef||'')+' '+(i.ppsSize||'')+' '+(i.topsSize||''))).toLowerCase();if(hay.indexOf(q)===-1)return false;}
    return true;
  }
  function applyFilters(){
    var f=state.filters,q=f.q.trim().toLowerCase();
    state.units=consolidateSuits(state.all);
    state.filtered=state.units.filter(function(i){return matches(i,f,q);});
    render();stats();
  }
  function render(){
    var root=$('#view');root.innerHTML='';
    if(!state.filtered.length){root.innerHTML='<div class="state">Nothing matches.</div>';return;}
    var months={};
    state.filtered.forEach(function(i){var nb=needByISO(i),mk=nb?nb.slice(0,7):'9999-99',lab=nb?(MONTHS[+nb.slice(5,7)-1]+' '+nb.slice(0,4)):'Date TBD';if(!months[mk])months[mk]={label:lab,items:[]};months[mk].items.push(i);});
    Object.keys(months).sort().forEach(function(mk){
      var mb=months[mk],block=document.createElement('div');block.className='bucket';
      block.innerHTML='<h2>Photos needed — '+esc(mb.label)+'</h2>';
      var pos={};mb.items.forEach(function(i){var p=(i.poRef||'—');(pos[p]=pos[p]||[]).push(i);});
      Object.keys(pos).sort(function(a,b){return (pos[a][0].bulkExf||'9999').localeCompare(pos[b][0].bulkExf||'9999')||a.localeCompare(b);}).forEach(function(p){block.appendChild(poBlock(p,pos[p]));});
      root.appendChild(block);
    });
  }
  function poBlock(po,items){
    var first=items[0],suit=first.isSuit;
    var wrap=document.createElement('div');wrap.className='po';
    var bar=document.createElement('div');bar.className='pobar';
    var label=suit?('SUIT'):po;
    bar.innerHTML='<span class="ponum">'+esc(label)+'</span><span class="pometa">'+(suit?(esc(first.parentName.replace(/^.*?— /,''))+' &middot; POs '+esc(first.poRefs.join(', '))+' &middot; '):'')+'Photos by <b>'+(fmtShort(needByISO(first))||'—')+'</b></span>';
    wrap.appendChild(bar);
    var t=document.createElement('table');
    t.innerHTML='<thead><tr><th class="c-cat">Category</th><th>Item Name</th><th class="c-size">PPS (Size)</th><th class="c-when">PPS ETA / Landed</th><th class="c-size">TOPS (Size)</th><th class="c-when">TOPS ETA / Landed</th><th class="c-appr">Approval</th><th class="c-shot">Shot / Not Shot</th></tr></thead><tbody></tbody>';
    var tb=t.querySelector('tbody');
    if(suit){ first.pieces.forEach(function(p){tb.appendChild(rowEl(p,true));}); tb.appendChild(suitShotRow(first)); }
    else { items.forEach(function(i){tb.appendChild(rowEl(i,false));}); }
    wrap.appendChild(t);return wrap;
  }
  function sizeCell(sz){var td=document.createElement('td');td.className='c-size';if(sz)td.textContent=sz;else td.innerHTML='<span class="none">&mdash;</span>';return td;}
  function whenCell(landed,display){var td=document.createElement('td');td.className='c-when';if(!display){td.innerHTML='<span class="none">&mdash;</span>';return td;}var s=document.createElement('span');s.className=landed?'landed':'eta';s.textContent=display;td.appendChild(s);return td;}
  function rowEl(i,inSuit){
    var tr=document.createElement('tr');
    var c=document.createElement('td');c.className='c-cat';c.textContent=i.category||'';tr.appendChild(c);
    var n=document.createElement('td');var dot=document.createElement('span');dot.className='dot '+(isReady(i)?'r':'w');n.appendChild(dot);n.appendChild(document.createTextNode(i.parentName||''));tr.appendChild(n);
    tr.appendChild(sizeCell(i.ppsSize||''));
    tr.appendChild(whenCell(ppsLanded(i),i.ppsDisplay||''));
    tr.appendChild(sizeCell(i.topsSize||''));
    tr.appendChild(whenCell(topsLanded(i),i.topsDisplay||''));
    if(inSuit){var ac=document.createElement('td');ac.className='c-appr';ac.innerHTML='<span class="none">&mdash;</span>';tr.appendChild(ac);}
    else{tr.appendChild(apprCell(i));}
    var sc=document.createElement('td');sc.className='c-shot';
    if(inSuit){sc.innerHTML='<span class="none">&mdash;</span>';}
    else{var sel=shotSelect(i);sc.appendChild(sel);}
    tr.appendChild(sc);return tr;
  }
  function shotSelect(i){var sel=document.createElement('select');sel.className='shot';['Not Shot','Shot'].forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;sel.appendChild(op);});var cur=shotOf(i);sel.value=cur;if(cur==='Shot')sel.classList.add('is-shot');sel.addEventListener('change',function(){sel.classList.toggle('is-shot',sel.value==='Shot');saveShot(i,sel.value);});return sel;}
  function apprCell(i){var td=document.createElement('td');td.className='c-appr';var f=F(i);var s=f.talStatus;
    if(s==='Approved'){td.innerHTML='<span class="appr-ok">✓ Approved</span>';}
    else if(s==='Hold'){td.innerHTML='<span class="appr-hold">On hold'+(f.talRecSize?': '+esc(f.talRecSize):'')+'</span>';}
    else{td.innerHTML='<span class="none">&mdash;</span>';}
    return td;}
  function suitShotRow(suit){var tr=document.createElement('tr');var td=document.createElement('td');td.colSpan=6;td.style.textAlign='right';td.style.fontSize='12px';td.style.color='var(--muted)';td.textContent='Suit — shoot status:';tr.appendChild(td);tr.appendChild(apprCell(suit));var sc=document.createElement('td');sc.className='c-shot';sc.appendChild(shotSelect(suit));tr.appendChild(sc);return tr;}

  function stats(){
    var f=state.filters,q=f.q.trim().toLowerCase();
    var scope=state.units.filter(function(i){if(f.status==='ready'&&!isReady(i))return false;if(f.pps&&!(i.isSuit?i.pieces.some(ppsLanded):ppsLanded(i)))return false;if(f.tops&&!(i.isSuit?i.pieces.some(topsLanded):topsLanded(i)))return false;if(q){var hay=(i.isSuit?(i.parentName+' '+i.poRefs.join(' ')):((i.parentName||'')+' '+(i.category||'')+' '+(i.poRef||'')+' '+(i.ppsSize||'')+' '+(i.topsSize||''))).toLowerCase();if(hay.indexOf(q)===-1)return false;}return true;});
    var notShot=scope.filter(function(i){return shotOf(i)!=='Shot';});
    $('#s-toshoot').textContent=notShot.length;
    $('#s-ready').textContent=notShot.filter(isReady).length;
    $('#count').textContent=state.filtered.length+' shown';
  }

  // ---- re-shoot queue ----
  function exportRow(i){var sw=shootWithOf(i);var sizes;if(i.isSuit){sizes=i.pieces.map(function(p){return (role(p.category)||'')+' '+((topsLanded(p)?p.topsSize:p.ppsSize)||p.ppsSize||p.topsSize||'?');}).join('; ');}else{sizes=sw==='PPS'?(i.ppsSize||''):(i.topsSize||i.ppsSize||'');}
    return {lands:i.bulkEta||'',exf:i.bulkExf||'',po:i.isSuit?i.poRefs.join(', '):(i.poRef||''),category:i.category||'',name:i.parentName||'',sizes:sizes,shootWith:sw,key:key(i)};}
  function inQueue(k){return state.reshoot.some(function(e){return e.key===k;});}
  function postReshoot(entry){postSave({type:'reshoot',action:'upsert',entry:entry});}
  function addToReshoot(entry){if(entry.key&&inQueue(entry.key)){renderQueue();return;}if(!entry.shootWith)entry.shootWith='PPS';state.reshoot.push(entry);saveLocal();postReshoot(entry);renderQueue();}
  function removeFromReshoot(idx){var e=state.reshoot[idx];state.reshoot.splice(idx,1);saveLocal();if(e&&e.key)postSave({type:'reshoot',action:'remove',key:e.key});renderQueue();}
  // Shared re-shoot queue: read everyone's queue from the server (JSONP), same as shot status.
  function loadReshoot(){if(!CONFIG.saveEndpoint)return;var cb='__rs_'+Date.now()+'_'+Math.floor(Math.random()*1e6);window[cb]=function(list){try{if(Array.isArray(list)){state.reshoot=list.map(function(e){return {lands:e.lands||'',exf:e.exf||'',po:e.po||'',category:e.category||'',name:e.name||'',sizes:e.sizes||'',shootWith:e.shootWith||'PPS',shot:e.shot||'Not Shot',key:e.key||('cat|'+(e.name||'').toLowerCase())};});saveLocal();renderQueue();}}catch(e){}try{delete window[cb];}catch(e){}};var s=document.createElement('script');s.src=CONFIG.saveEndpoint+'?callback='+cb+'&what=reshoot&t='+Date.now();s.onerror=function(){try{delete window[cb];}catch(e){}};document.head.appendChild(s);}
  // Re-shoot queue rendered like "Photos needed": Category · Item Name · PPS/TOPS/Bulk (pick) · Sizes · Reshoot.
  function renderQueue(){
    var q=$('#rs-queue');q.innerHTML='';
    if(!state.reshoot.length){q.innerHTML='<span style="font-size:12px;color:var(--muted)">No re-shoots queued.</span>';return;}
    var wrap=document.createElement('div');wrap.className='bucket';wrap.innerHTML='<h2>Style for Reshoot</h2>';
    var po=document.createElement('div');po.className='po';
    var t=document.createElement('table');
    t.innerHTML='<thead><tr><th class="c-cat">Category</th><th>Item Name</th><th class="c-pick">PPS</th><th class="c-pick">TOPS</th><th class="c-pick">Bulk</th><th class="c-size">Sizes</th><th class="c-shot">Shot / Not Shot</th><th class="c-shot">Reshoot</th></tr></thead><tbody></tbody>';
    var tb=t.querySelector('tbody');
    state.reshoot.forEach(function(e,idx){
      if(!e.shootWith||['PPS','TOPS','Bulk'].indexOf(e.shootWith)===-1)e.shootWith='PPS';
      var tr=document.createElement('tr');
      var c=document.createElement('td');c.className='c-cat';c.textContent=e.category||'';tr.appendChild(c);
      var n=document.createElement('td');n.textContent=e.name||'';tr.appendChild(n);
      ['PPS','TOPS','Bulk'].forEach(function(opt){var td=document.createElement('td');td.className='c-pick';var rb=document.createElement('input');rb.type='radio';rb.name='rsw_'+idx;rb.checked=(e.shootWith===opt);rb.addEventListener('change',function(){e.shootWith=opt;saveLocal();postReshoot(e);});td.appendChild(rb);tr.appendChild(td);});
      var sz=document.createElement('td');sz.className='c-size';var inp=document.createElement('input');inp.type='text';inp.className='rs-size';inp.value=e.sizes||'';inp.placeholder='sizes';inp.addEventListener('input',function(){e.sizes=inp.value;saveLocal();});inp.addEventListener('change',function(){postReshoot(e);});sz.appendChild(inp);tr.appendChild(sz);
      if(!e.shot)e.shot='Not Shot';var stc=document.createElement('td');stc.className='c-shot';var ssel=document.createElement('select');ssel.className='shot';['Not Shot','Shot'].forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;ssel.appendChild(op);});ssel.value=e.shot;if(e.shot==='Shot')ssel.classList.add('is-shot');ssel.addEventListener('change',function(){e.shot=ssel.value;ssel.classList.toggle('is-shot',ssel.value==='Shot');saveLocal();postReshoot(e);});stc.appendChild(ssel);tr.appendChild(stc);
      var rc=document.createElement('td');rc.className='c-shot';var btn=document.createElement('button');btn.type='button';btn.className='rs-remove';btn.textContent='✕ Remove';btn.addEventListener('click',function(){removeFromReshoot(idx);});rc.appendChild(btn);tr.appendChild(rc);
      tb.appendChild(tr);
    });
    po.appendChild(t);wrap.appendChild(po);q.appendChild(wrap);
  }

  // Re-shoot search source = full catalog (preferred) merged with feed data; falls back to the feed.
  function reshootSource(){
    if(state.catalog&&state.catalog.length){
      return state.catalog.map(function(c){var u=state.units.find(function(x){return !x.isSuit&&(x.parentName||'').toLowerCase()===c.name.toLowerCase();});return u?{name:u.parentName,po:u.poRef||'',category:u.category||'',unit:u}:{name:c.name,po:c.po||'',category:c.category||'',sizes:c.sizes||'',unit:null};});
    }
    return state.units.map(function(u){return {name:u.parentName,po:(u.isSuit?u.poRefs.join(', '):u.poRef)||'',category:u.category||'',unit:u};});
  }
  function catalogSearch(q){q=q.toLowerCase();return reshootSource().filter(function(c){return ((c.name||'')+' '+(c.po||'')+' '+(c.category||'')).toLowerCase().indexOf(q)!==-1;}).slice(0,15);}
  function entryFor(c){return c.unit?exportRow(c.unit):{lands:'',exf:'',po:c.po||'',category:c.category||'(re-shoot)',name:c.name,sizes:c.sizes||'',shootWith:'',key:'cat|'+(c.name||'').toLowerCase()};}
  function customEntry(q){return {lands:'',exf:'',po:'',category:'(custom)',name:q,sizes:'',shootWith:'',key:'custom|'+q.toLowerCase()};}
  // Live autocomplete: as you type, suggest catalog matches (incl. products not in the current list); click one to queue a re-shoot. Last row always lets you add a custom item.
  function suggest(){
    var q=(($('#search').value)||'').trim();var box=$('#rs-matches');
    if(q.length<2){box.style.display='none';box.innerHTML='';return;}
    var hits=catalogSearch(q);box.innerHTML='';
    hits.forEach(function(c){var d=document.createElement('div');d.textContent=c.name+'  ·  '+(c.po||'—')+'  ·  '+(c.category||'')+(c.unit?'':'  · not in current list — add re-shoot');d.title='Add to re-shoot';d.addEventListener('click',function(){addToReshoot(entryFor(c));box.style.display='none';box.innerHTML='';});box.appendChild(d);});
    var add=document.createElement('div');add.style.color='var(--muted)';add.textContent='+ Add “'+q+'” as a custom re-shoot';add.addEventListener('click',function(){addToReshoot(customEntry(q));box.style.display='none';box.innerHTML='';});box.appendChild(add);
    box.style.display='block';
  }

  // ---- excel export ----
  function tableToXls(cols,rows){
    var thead='<tr>'+cols.map(function(c){return '<th style="background:#eee;border:1px solid #999;padding:5px 8px;text-align:left">'+esc(c)+'</th>';}).join('')+'</tr>';
    var body=rows.map(function(r){return '<tr>'+r.map(function(c){return '<td style="border:1px solid #ccc;padding:5px 8px">'+esc(c)+'</td>';}).join('')+'</tr>';}).join('');
    var sheetXml='<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Ready to Shoot</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->';
    var full='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+sheetXml+'</head><body><table border="1">'+thead+body+'</table></body></html>';
    var blob=new Blob(['﻿'+full],{type:'application/vnd.ms-excel'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='Shoot_List_Ready_'+new Date().toISOString().slice(0,10)+'.xls';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  }
  function exportExcel(){
    var seen={};var out=[];
    state.units.forEach(function(i){if(isReady(i)&&shotOf(i)!=='Shot'){var r=exportRow(i);seen[r.key]=true;out.push(r);}});
    state.reshoot.forEach(function(e){if(e.shot==='Shot')return;if(e.key&&seen[e.key])return;out.push(e);});
    out.sort(function(a,b){return (a.exf||'9999').localeCompare(b.exf||'9999')||(a.po||'').localeCompare(b.po||'');});
    var cols=['Lands','EXF','PO','Category','Item Name','Sizes','Shoot With'];
    var rows=out.map(function(r){return [r.lands,r.exf,r.po,r.category,r.name,r.sizes,r.shootWith];});
    if(!rows.length)rows=[['(nothing ready or queued)','','','','','','']];
    tableToXls(cols,rows);
  }

  // ---- events ----
  document.querySelectorAll('#seg-status button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('#seg-status button').forEach(function(x){x.classList.remove('active');});b.classList.add('active');state.filters.status=b.dataset.v;applyFilters();});});
  document.querySelectorAll('#seg-shot button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('#seg-shot button').forEach(function(x){x.classList.remove('active');});b.classList.add('active');state.filters.shot=b.dataset.v;applyFilters();});});
  $('#search').addEventListener('input',function(e){state.filters.q=e.target.value;applyFilters();suggest();});
  $('#t-pps').addEventListener('change',function(e){state.filters.pps=e.target.checked;applyFilters();});
  $('#t-tops').addEventListener('change',function(e){state.filters.tops=e.target.checked;applyFilters();});
  $('#refresh').addEventListener('click',function(){load();loadCatalog();liveLoadStatus();loadReshoot();});
  $('#export').addEventListener('click',exportExcel);

  $('#src').textContent=CONFIG.owner+'/'+CONFIG.repo+'/'+CONFIG.file+'  ·  reads the same feed';
  loadLocal();load();loadCatalog();liveLoadStatus();loadReshoot();setInterval(liveLoadStatus,3*60*1000);setInterval(loadReshoot,3*60*1000);
})();
</script>
</body>
</html>
